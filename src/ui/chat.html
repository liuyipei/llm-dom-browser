<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM-DOM Browser Chat</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: #f5f5f5;
        color: #333;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: #2c3e50;
        color: white;
        padding: 16px;
        text-align: center;
        border-bottom: 1px solid #34495e;
      }

      .header h1 {
        font-size: 18px;
        margin-bottom: 4px;
      }

      .header p {
        font-size: 12px;
        opacity: 0.8;
      }

      .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        padding: 12px;
        border-radius: 8px;
        max-width: 100%;
        word-wrap: break-word;
      }

      .message.user {
        background: #3498db;
        color: white;
        align-self: flex-end;
        margin-left: 20px;
      }

      .message.assistant {
        background: #ecf0f1;
        color: #333;
        align-self: flex-start;
        margin-right: 20px;
      }

      .message.system {
        background: #f39c12;
        color: white;
        text-align: center;
        font-size: 12px;
        align-self: center;
      }

      .tabs-section {
        border-top: 1px solid #ddd;
        padding: 12px;
        background: #fafafa;
        max-height: 150px;
        overflow-y: auto;
      }

      .tabs-section h3 {
        font-size: 12px;
        margin-bottom: 8px;
        color: #666;
        text-transform: uppercase;
      }

      .tabs-section .help-text {
        font-size: 10px;
        color: #999;
        margin-bottom: 6px;
        font-style: italic;
      }

      .tab-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tab-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 8px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 11px;
        cursor: pointer;
      }

      .tab-item:hover {
        background: #f0f0f0;
      }

      .tab-item .clickable-area:hover {
        background: #e8f4f8;
        border-radius: 3px;
      }

      .tab-item.active {
        background: #3498db;
        color: white;
        border-color: #3498db;
      }

      /* Don't apply light hover background when tab is selected (active) */
      .tab-item.active .clickable-area:hover {
        background: #2980b9; /* Darker blue for hover on selected tabs */
      }

      .tab-item.current {
        border: 2px solid #e67e22;
        border-left: 4px solid #e67e22;
        background: #fef5e7;
      }

      .tab-item.current.active {
        background: #3498db;
        border-color: #2980b9;
      }

      .tab-item button {
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 2px 6px;
        font-size: 10px;
        cursor: pointer;
      }

      .tab-item button:hover {
        background: #c0392b;
      }

      .input-section {
        border-top: 1px solid #ddd;
        padding: 12px;
        background: white;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .input-row {
        display: flex;
        gap: 8px;
      }

      input[type='text'],
      input[type='password'],
      input[type='file'],
      select {
        flex: 1;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 12px;
      }

      select {
        cursor: pointer;
        background: white;
      }

      .input-row label {
        min-width: 70px;
        font-size: 12px;
        color: #555;
        font-weight: 500;
      }

      button {
        padding: 8px 12px;
        background: #27ae60;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      }

      button:hover {
        background: #229954;
      }

      button:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
      }

      .button-small {
        padding: 4px 8px;
        font-size: 11px;
      }

      .status {
        font-size: 11px;
        color: #666;
        padding: 4px 0;
      }

      .error {
        color: #e74c3c;
      }

      .success {
        color: #27ae60;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🤖 LLM-DOM Browser</h1>
      <p>Analyze web content with AI</p>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="message system">
        Welcome to LLM-DOM Browser. Open tabs and ask questions about their content!
      </div>
    </div>

    <div class="tabs-section">
      <h3>📑 Open Tabs</h3>
      <div class="help-text">Click tab to view, checkbox to select for LLM</div>
      <div class="tab-list" id="tabList"></div>
    </div>

    <div class="input-section">
      <div class="input-row">
        <input type="text" id="urlInput" placeholder="Enter URL or file path..." />
        <button id="openBtn" class="button-small">Open</button>
      </div>

      <div class="input-row">
        <input type="file" id="fileInput" accept=".pdf,.txt,.md" />
        <button id="uploadBtn" class="button-small">Upload</button>
      </div>

      <div class="input-row">
        <input type="password" id="apiKeyInput" placeholder="API Key..." />
      </div>

      <div class="input-row">
        <label for="providerSelect">Provider:</label>
        <select id="providerSelect">
          <option value="openai">OpenAI (GPT-5.1)</option>
          <option value="anthropic">Anthropic (Claude 4.5)</option>
          <option value="google">Google (Gemini 2.5 Pro)</option>
          <option value="xai">xAI (Grok 4)</option>
          <option value="deepseek">DeepSeek (V3.2 Exp)</option>
          <option value="kimi">Kimi (K2 Thinking)</option>
          <option value="minimax">MiniMax (M2)</option>
          <option value="glm">GLM (4.6)</option>
          <option value="openrouter">OpenRouter</option>
          <option value="fireworks">Fireworks AI</option>
        </select>
      </div>

      <div class="input-row">
        <label for="modelSelect">Model:</label>
        <select id="modelSelect">
          <option value="">Default</option>
        </select>
      </div>

      <div class="input-row">
        <label>
          <input type="checkbox" id="includeMediaCheckbox" />
          Include page screenshot for vision models (512px max, visible area)
        </label>
      </div>

      <div class="input-row">
        <input type="text" id="queryInput" placeholder="Ask a question..." />
        <button id="sendBtn" class="button-small">Send</button>
      </div>

      <div class="status" id="status"></div>
    </div>

    <script>
      // Storage constants
      const STORAGE_KEY = 'llm-dom-browser-settings';

      // Storage management
      const storage = {
        load() {
          try {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : { apiKeys: {}, selectedModels: {} };
          } catch (error) {
            console.error('Error loading settings:', error);
            return { apiKeys: {}, selectedModels: {} };
          }
        },

        save(data) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
          } catch (error) {
            console.error('Error saving settings:', error);
          }
        },

        getApiKey(provider) {
          const data = this.load();
          return data.apiKeys[provider] || '';
        },

        saveApiKey(provider, apiKey) {
          const data = this.load();
          data.apiKeys[provider] = apiKey;
          this.save(data);
        },

        getSelectedModel(provider) {
          const data = this.load();
          return data.selectedModels[provider] || '';
        },

        saveSelectedModel(provider, model) {
          const data = this.load();
          data.selectedModels[provider] = model;
          this.save(data);
        }
      };

      // UI State
      const state = {
        activeTabs: new Map(),
        selectedTabs: new Set(),
        activeTabId: null, // Currently visible tab
        isLoading: false
      };

      // DOM Elements
      const chatContainer = document.getElementById('chatContainer');
      const tabList = document.getElementById('tabList');
      const urlInput = document.getElementById('urlInput');
      const openBtn = document.getElementById('openBtn');
      const fileInput = document.getElementById('fileInput');
      const uploadBtn = document.getElementById('uploadBtn');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const providerSelect = document.getElementById('providerSelect');
      const modelSelect = document.getElementById('modelSelect');
      const includeMediaCheckbox = document.getElementById('includeMediaCheckbox');
      const queryInput = document.getElementById('queryInput');
      const sendBtn = document.getElementById('sendBtn');
      const statusEl = document.getElementById('status');

      // Provider models data
      let providersData = null;

      /**
       * Load available providers and models
       */
      async function loadProviders() {
        try {
          const data = await window.electronAPI.getProviders();
          providersData = data;
          updateModelSelect();
        } catch (error) {
          console.error('Error loading providers:', error);
        }
      }

      /**
       * Update model dropdown based on selected provider
       */
      function updateModelSelect() {
        if (!providersData) return;

        const provider = providerSelect.value;
        const models = providersData.models[provider] || {};

        // Clear existing options
        modelSelect.innerHTML = '<option value="">Default</option>';

        // Add models for selected provider
        Object.entries(models).forEach(([modelId, modelInfo]) => {
          const option = document.createElement('option');
          option.value = modelId;
          option.textContent = modelInfo.name || modelId;
          modelSelect.appendChild(option);
        });

        // For OpenRouter and Fireworks, show option to fetch latest models
        if (provider === 'openrouter' || provider === 'fireworks') {
          const fetchOption = document.createElement('option');
          fetchOption.value = '__fetch__';
          fetchOption.textContent = '🔄 Fetch Latest Models...';
          fetchOption.style.fontWeight = 'bold';
          modelSelect.insertBefore(fetchOption, modelSelect.firstChild.nextSibling);
        }

        // Restore previously selected model for this provider
        const savedModel = storage.getSelectedModel(provider);
        if (savedModel && modelSelect.querySelector(`option[value="${savedModel}"]`)) {
          modelSelect.value = savedModel;
        }
      }

      /**
       * Fetch models dynamically for OpenRouter/Fireworks
       */
      async function fetchDynamicModels() {
        const provider = providerSelect.value;
        const apiKey = apiKeyInput.value.trim();

        if (!apiKey) {
          updateStatus('Please enter API key to fetch models', 'error');
          return;
        }

        if (provider !== 'openrouter' && provider !== 'fireworks') {
          return;
        }

        try {
          updateStatus(`Fetching latest models from ${provider}...`);
          const result = await window.electronAPI.fetchProviderModels(provider, apiKey);

          if (result.success && result.models) {
            // Clear and repopulate dropdown
            modelSelect.innerHTML = '<option value="">Default (Recommended)</option>';

            // Add flagship models section
            if (result.models.flagship && result.models.flagship.length > 0) {
              const flagshipGroup = document.createElement('optgroup');
              flagshipGroup.label = '⭐ Flagship Models';
              result.models.flagship.forEach(model => {
                const option = document.createElement('option');
                option.value = model.id;
                option.textContent = `${model.name} (${Math.floor(model.context_length / 1000)}K)`;
                flagshipGroup.appendChild(option);
              });
              modelSelect.appendChild(flagshipGroup);
            }

            // Add reasoning models section
            if (result.models.reasoning && result.models.reasoning.length > 0) {
              const reasoningGroup = document.createElement('optgroup');
              reasoningGroup.label = '🧠 Reasoning Models';
              result.models.reasoning.forEach(model => {
                const option = document.createElement('option');
                option.value = model.id;
                option.textContent = `${model.name} (${Math.floor(model.context_length / 1000)}K)`;
                reasoningGroup.appendChild(option);
              });
              modelSelect.appendChild(reasoningGroup);
            }

            // Add coding models section
            if (result.models.coding && result.models.coding.length > 0) {
              const codingGroup = document.createElement('optgroup');
              codingGroup.label = '💻 Coding Models';
              result.models.coding.forEach(model => {
                const option = document.createElement('option');
                option.value = model.id;
                option.textContent = `${model.name} (${Math.floor(model.context_length / 1000)}K)`;
                codingGroup.appendChild(option);
              });
              modelSelect.appendChild(codingGroup);
            }

            // Add all models section
            if (result.models.all && result.models.all.length > 0) {
              const allGroup = document.createElement('optgroup');
              allGroup.label = '📋 All Available Models';
              result.models.all.forEach(model => {
                const option = document.createElement('option');
                option.value = model.id;
                const contextSize = model.context_length ? ` (${Math.floor(model.context_length / 1000)}K)` : '';
                option.textContent = `${model.name}${contextSize}`;
                allGroup.appendChild(option);
              });
              modelSelect.appendChild(allGroup);
            }

            updateStatus(`Loaded ${result.models.all.length} models from ${provider}`, 'success');
          } else {
            updateStatus(`Failed to fetch models: ${result.error || 'Unknown error'}`, 'error');
          }
        } catch (error) {
          updateStatus(`Error fetching models: ${error.message}`, 'error');
        }
      }

      // Update model select when provider changes
      providerSelect.addEventListener('change', (e) => {
        const provider = e.target.value;
        // Save API key and clear model when switching providers
        storage.saveApiKey(provider, apiKeyInput.value.trim());
        updateModelSelect();
      });

      // Handle model selection - fetch dynamic models if needed
      modelSelect.addEventListener('change', async (e) => {
        const provider = providerSelect.value;
        const model = e.target.value;

        // Save model selection when it changes (unless it's the fetch option)
        if (model !== '__fetch__') {
          storage.saveSelectedModel(provider, model);
        }

        // Fetch dynamic models if requested
        if (model === '__fetch__') {
          await fetchDynamicModels();
        }
      });

      // Save API key when it changes
      apiKeyInput.addEventListener('change', (e) => {
        const provider = providerSelect.value;
        const apiKey = e.target.value.trim();
        storage.saveApiKey(provider, apiKey);
      });

      /**
       * Add message to chat
       */
      function addMessage(text, type = 'assistant') {
        const messageEl = document.createElement('div');
        messageEl.className = `message ${type}`;
        messageEl.textContent = text;
        chatContainer.appendChild(messageEl);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      /**
       * Update status message
       */
      function updateStatus(text, type = 'info') {
        statusEl.textContent = text;
        statusEl.className = `status ${type}`;
      }

      /**
       * Open a tab with URL
       */
      async function handleOpenTab() {
        const url = urlInput.value.trim();
        if (!url) {
          updateStatus('Please enter a URL', 'error');
          return;
        }

        try {
          setLoading(true);
          updateStatus('Opening tab...');

          // Ensure URL has protocol
          let finalUrl = url;
          if (!url.startsWith('http') && !url.startsWith('file')) {
            finalUrl = 'https://' + url;
          }

          const result = await window.electronAPI.openTab(finalUrl);
          console.log('[UI] Tab opened, result:', result);

          // Use the title from the result if available, otherwise default to 'Loading...'
          const initialTitle = result.title || 'Loading...';
          state.activeTabs.set(result.id, { url: result.url, title: initialTitle });

          // Set as active tab if it's the first tab
          if (result.isActive) {
            state.activeTabId = result.id;
          }

          console.log('[UI] Active tabs after opening:', Array.from(state.activeTabs.entries()));
          addMessage(`✅ Opened: ${finalUrl}`, 'system');
          updateStatus('Tab opened successfully', 'success');
          urlInput.value = '';
          renderTabs();
        } catch (error) {
          updateStatus(`Error: ${error.message}`, 'error');
          addMessage(`❌ Error: ${error.message}`, 'system');
        } finally {
          setLoading(false);
        }
      }

      /**
       * Upload a file
       */
      async function handleUploadFile() {
        const file = fileInput.files[0];
        if (!file) {
          updateStatus('Please select a file', 'error');
          return;
        }

        try {
          setLoading(true);
          updateStatus('Uploading file...');

          // In a real app, you'd use a file dialog here
          // For now, we'll mock it
          const result = await window.electronAPI.uploadFile(file.name, file.name);
          state.activeTabs.set(result.tabId, { url: file.name, title: result.fileName });

          addMessage(`📄 Uploaded: ${file.name}`, 'system');
          updateStatus('File uploaded successfully', 'success');
          fileInput.value = '';
          renderTabs();
        } catch (error) {
          updateStatus(`Error: ${error.message}`, 'error');
          addMessage(`❌ Error: ${error.message}`, 'system');
        } finally {
          setLoading(false);
        }
      }

      /**
       * Send query to LLM
       */
      async function handleSendQuery() {
        const query = queryInput.value.trim();
        const apiKey = apiKeyInput.value.trim();
        const provider = providerSelect.value;
        const model = modelSelect.value || null;
        const tabIds = Array.from(state.selectedTabs);
        const includeMedia = includeMediaCheckbox.checked;

        if (!query) {
          updateStatus('Please enter a question', 'error');
          return;
        }

        if (!apiKey) {
          updateStatus('Please enter API key', 'error');
          return;
        }

        if (tabIds.length === 0) {
          updateStatus('Please select at least one tab', 'error');
          return;
        }

        try {
          setLoading(true);
          updateStatus(`Analyzing content with ${provider}...`);
          addMessage(`Q: ${query}`, 'user');

          const result = await window.electronAPI.queryLLM(query, tabIds, apiKey, provider, model, includeMedia);

          if (result.success) {
            addMessage(result.response, 'assistant');
            updateStatus(
              `Response generated using ${result.provider} (${result.tokensUsed} tokens)`,
              'success'
            );
          } else {
            updateStatus(`Error: ${result.error}`, 'error');
            addMessage(`❌ Error: ${result.error}`, 'system');
          }

          queryInput.value = '';
        } catch (error) {
          updateStatus(`Error: ${error.message}`, 'error');
          addMessage(`❌ Error: ${error.message}`, 'system');
        } finally {
          setLoading(false);
        }
      }

      /**
       * Close a tab
       */
      async function closeTab(tabId) {
        try {
          await window.electronAPI.closeTab(tabId);
          state.activeTabs.delete(tabId);
          state.selectedTabs.delete(tabId);
          addMessage(`Closed tab`, 'system');
          renderTabs();
        } catch (error) {
          updateStatus(`Error closing tab: ${error.message}`, 'error');
        }
      }

      /**
       * Switch to a tab (make it visible)
       */
      async function switchTab(tabId) {
        try {
          await window.electronAPI.switchTab(tabId);
          // The active tab will be updated via the onActiveTabChanged listener
        } catch (error) {
          console.error('Error switching tab:', error);
          updateStatus(`Error switching tab: ${error.message}`, 'error');
        }
      }

      /**
       * Toggle tab selection for LLM query
       */
      function toggleTabSelection(tabId) {
        if (state.selectedTabs.has(tabId)) {
          state.selectedTabs.delete(tabId);
        } else {
          state.selectedTabs.add(tabId);
        }
        renderTabs();
      }

      /**
       * Render tabs list
       */
      function renderTabs() {
        tabList.innerHTML = '';
        state.activeTabs.forEach((tab, tabId) => {
          const isSelected = state.selectedTabs.has(tabId);
          const isCurrent = state.activeTabId === tabId;
          const tabEl = document.createElement('div');

          // Add classes for visual states
          const classes = ['tab-item'];
          if (isSelected) classes.push('active');
          if (isCurrent) classes.push('current');
          tabEl.className = classes.join(' ');

          // Create tab content with checkbox and title
          const title = tab.title || 'Untitled';
          const currentIndicator = isCurrent ? '👁 ' : '';

          // Create checkbox
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = isSelected;
          checkbox.style.cursor = 'pointer';
          checkbox.title = isSelected ? 'Remove from LLM query' : 'Include in LLM query';
          checkbox.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent triggering tab switch
            toggleTabSelection(tabId);
          });

          // Create title span
          const titleSpan = document.createElement('span');
          titleSpan.textContent = `${currentIndicator}${title}`;

          // Create clickable div for tab switching
          const clickableDiv = document.createElement('div');
          clickableDiv.className = 'clickable-area';
          clickableDiv.style.cssText = 'flex: 1; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 2px;';
          clickableDiv.title = isCurrent ? 'Currently viewing (click to refresh)' : 'Click to switch to this tab';
          clickableDiv.appendChild(checkbox);
          clickableDiv.appendChild(titleSpan);
          clickableDiv.addEventListener('click', (e) => {
            // Only switch tabs if not clicking the checkbox
            if (e.target !== checkbox) {
              switchTab(tabId);
            }
          });

          // Create close button
          const closeBtn = document.createElement('button');
          closeBtn.textContent = 'Close';
          closeBtn.className = 'button-small';
          closeBtn.addEventListener('click', () => closeTab(tabId));

          tabEl.appendChild(clickableDiv);
          tabEl.appendChild(closeBtn);
          tabList.appendChild(tabEl);
        });
      }

      /**
       * Set loading state
       */
      function setLoading(loading) {
        state.isLoading = loading;
        openBtn.disabled = loading;
        uploadBtn.disabled = loading;
        sendBtn.disabled = loading;
        urlInput.disabled = loading;
        queryInput.disabled = loading;
      }

      // Event Listeners
      openBtn.addEventListener('click', handleOpenTab);
      uploadBtn.addEventListener('click', handleUploadFile);
      sendBtn.addEventListener('click', handleSendQuery);
      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleOpenTab();
      });
      queryInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSendQuery();
      });

      // Listen for tab title updates from main process
      if (window.electronAPI && window.electronAPI.onTabTitleUpdated) {
        console.log('[UI] Setting up onTabTitleUpdated listener');
        window.electronAPI.onTabTitleUpdated((data) => {
          console.log('[UI] Received tab-title-updated event:', data);
          const { tabId, title } = data;
          const tab = state.activeTabs.get(tabId);
          if (tab) {
            console.log(`[UI] Updating tab ${tabId} title from "${tab.title}" to "${title}"`);
            tab.title = title;
            state.activeTabs.set(tabId, tab);
            renderTabs();
          } else {
            console.warn(`[UI] Received title update for unknown tab ${tabId}`);
          }
        });
      } else {
        console.error('[UI] electronAPI.onTabTitleUpdated not available!');
      }

      // Listen for active tab changes from main process
      if (window.electronAPI && window.electronAPI.onActiveTabChanged) {
        console.log('[UI] Setting up onActiveTabChanged listener');
        window.electronAPI.onActiveTabChanged((data) => {
          console.log('[UI] Received active-tab-changed event:', data);
          const { tabId } = data;
          state.activeTabId = tabId;
          renderTabs();
        });
      } else {
        console.error('[UI] electronAPI.onActiveTabChanged not available!');
      }

      // Initialize
      async function initialize() {
        // Load providers
        await loadProviders();

        // Restore stored API key for current provider
        const provider = providerSelect.value;
        const savedApiKey = storage.getApiKey(provider);
        if (savedApiKey) {
          apiKeyInput.value = savedApiKey;
        }

        // The model will be restored automatically when updateModelSelect is called above

        updateStatus('Ready', 'success');
        addMessage('👋 Welcome! Open a URL or upload a file to get started.', 'system');
        addMessage('💡 Tip: Press F12 to open DevTools for the UI, Ctrl+Shift+C for the active tab', 'system');
      }

      initialize();
    </script>
  </body>
</html>
