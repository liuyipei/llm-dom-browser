<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM-DOM Browser Chat</title>

    <!-- Markdown, Code Highlighting, Math, and Sanitization Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: #f5f5f5;
        color: #333;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        background: #2c3e50;
        color: white;
        padding: 16px;
        border-bottom: 1px solid #34495e;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-content {
        flex: 1;
        text-align: center;
      }

      .header h1 {
        font-size: 18px;
        margin-bottom: 4px;
      }

      .header p {
        font-size: 12px;
        opacity: 0.8;
      }

      .menu-button {
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        width: 36px;
        height: 36px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        transition: all 0.2s ease;
        flex-shrink: 0;
      }

      .menu-button:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.5);
      }

      .menu-button:active {
        background: rgba(255, 255, 255, 0.2);
      }

      .menu-button.active {
        background: rgba(52, 152, 219, 0.3);
        border-color: #3498db;
      }

      .chat-container {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        padding: 12px;
        border-radius: 8px;
        max-width: 100%;
        word-wrap: break-word;
      }

      .message.user {
        background: #3498db;
        color: white;
        align-self: flex-start;
        margin-right: 20px;
      }

      .message.assistant {
        background: #ecf0f1;
        color: #333;
        align-self: flex-end;
        margin-left: 20px;
      }

      .message.system {
        background: #f39c12;
        color: white;
        text-align: center;
        font-size: 12px;
        align-self: center;
      }

      .message.error {
        background: #e74c3c;
        color: white;
        align-self: flex-end;
        margin-left: 20px;
      }

      .message-stats {
        font-size: 10px;
        color: #7f8c8d;
        margin-top: 4px;
        padding: 4px 8px;
        background: rgba(0, 0, 0, 0.05);
        border-radius: 4px;
        font-family: monospace;
      }

      .message-stats .stat-item {
        display: inline-block;
        margin-right: 12px;
      }

      .message-stats .stat-label {
        font-weight: 600;
      }

      .message-container {
        display: flex;
        flex-direction: column;
        max-width: 100%;
      }

      .message-container.user {
        align-items: flex-start;
      }

      .message-container.assistant {
        align-items: flex-end;
      }

      .tabs-section {
        border-top: 1px solid #ddd;
        padding: 12px;
        background: #fafafa;
        max-height: 150px;
        overflow-y: auto;
        transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
      }

      .tabs-section.collapsed {
        max-height: 0;
        padding: 0 12px;
        opacity: 0;
        overflow: hidden;
      }

      .tabs-section h3 {
        font-size: 12px;
        margin-bottom: 8px;
        color: #666;
        text-transform: uppercase;
      }

      .tabs-section .help-text {
        font-size: 10px;
        color: #999;
        margin-bottom: 6px;
        font-style: italic;
      }

      .tab-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .tab-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 8px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 11px;
        cursor: pointer;
      }

      .tab-item:hover {
        background: #f0f0f0;
      }

      .tab-item .clickable-area:hover {
        background: #e8f4f8;
        border-radius: 3px;
      }

      .tab-item.active {
        background: #3498db;
        color: white;
        border-color: #3498db;
      }

      /* Don't apply light hover background when tab is selected (active) */
      .tab-item.active .clickable-area:hover {
        background: #2980b9; /* Darker blue for hover on selected tabs */
      }

      .tab-item.current {
        border: 2px solid #e67e22;
        border-left: 4px solid #e67e22;
        background: #fef5e7;
      }

      .tab-item.current.active {
        background: #3498db;
        border-color: #2980b9;
      }

      .tab-item button {
        background: #e74c3c;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 2px 6px;
        font-size: 10px;
        cursor: pointer;
      }

      .tab-item button:hover {
        background: #c0392b;
      }

      .input-section {
        border-top: 1px solid #ddd;
        padding: 12px;
        padding-bottom: 20px;
        background: white;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
        max-height: 500px;
        overflow-y: auto;
      }

      .input-section.collapsed {
        max-height: 0;
        padding: 0 12px;
        opacity: 0;
        overflow: hidden;
      }

      .input-row {
        display: flex;
        gap: 8px;
      }

      input[type='text'],
      input[type='password'],
      input[type='file'],
      select {
        flex: 1;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 12px;
      }

      select {
        cursor: pointer;
        background: white;
      }

      #modelSearchInput {
        font-size: 11px;
        padding: 6px 8px;
        border: 1px solid #ccc;
        background: #f9f9f9;
        transition: all 0.2s ease;
      }

      #modelSearchInput:focus {
        outline: none;
        border-color: #4CAF50;
        background: white;
        box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.1);
      }

      #modelSearchInput::placeholder {
        color: #999;
        font-style: italic;
      }

      .input-row label {
        min-width: 70px;
        font-size: 12px;
        color: #555;
        font-weight: 500;
      }

      button {
        padding: 8px 12px;
        background: #27ae60;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      }

      button:hover {
        background: #229954;
      }

      button:disabled {
        background: #bdc3c7;
        cursor: not-allowed;
      }

      .button-small {
        padding: 4px 8px;
        font-size: 11px;
      }

      .status {
        font-size: 11px;
        color: #666;
        padding: 4px 0;
      }

      .error {
        color: #e74c3c;
      }

      .success {
        color: #27ae60;
      }

      /* Message controls (copy button and toggle) */
      .message-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
      }

      .message-controls button {
        padding: 4px 8px;
        font-size: 10px;
        background: #95a5a6;
        border-radius: 3px;
      }

      .message-controls button:hover {
        background: #7f8c8d;
      }

      .message-controls .copy-btn {
        background: #3498db;
      }

      .message-controls .copy-btn:hover {
        background: #2980b9;
      }

      .message-controls .copy-btn.copied {
        background: #27ae60;
      }

      .message-controls label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        color: #666;
        cursor: pointer;
        user-select: none;
      }

      .message-controls input[type="checkbox"] {
        cursor: pointer;
      }

      /* Rendered content styling */
      .message-content {
        line-height: 1.6;
      }

      .message-content pre {
        background: #f6f8fa;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 16px;
        overflow-x: auto;
        margin: 12px 0;
      }

      .message-content code {
        background: #f6f8fa;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9em;
      }

      .message-content pre code {
        background: none;
        padding: 0;
        border-radius: 0;
      }

      .message-content blockquote {
        border-left: 4px solid #d0d7de;
        padding-left: 16px;
        margin: 12px 0;
        color: #57606a;
      }

      .message-content table {
        border-collapse: collapse;
        width: 100%;
        margin: 12px 0;
      }

      .message-content table th,
      .message-content table td {
        border: 1px solid #d0d7de;
        padding: 8px;
        text-align: left;
      }

      .message-content table th {
        background: #f6f8fa;
        font-weight: 600;
      }

      .message-content h1,
      .message-content h2,
      .message-content h3,
      .message-content h4,
      .message-content h5,
      .message-content h6 {
        margin-top: 16px;
        margin-bottom: 8px;
        font-weight: 600;
      }

      .message-content h1 { font-size: 1.5em; }
      .message-content h2 { font-size: 1.3em; }
      .message-content h3 { font-size: 1.1em; }

      .message-content ul,
      .message-content ol {
        margin: 8px 0;
        padding-left: 24px;
      }

      .message-content li {
        margin: 4px 0;
      }

      .message-content p {
        margin: 8px 0;
      }

      .message-content a {
        color: #0969da;
        text-decoration: none;
      }

      .message-content a:hover {
        text-decoration: underline;
      }

      /* Math rendering */
      .message-content .katex {
        font-size: 1.1em;
      }

      .message-content .katex-display {
        margin: 16px 0;
        overflow-x: auto;
        overflow-y: hidden;
      }

      /* Raw text view */
      .message-raw {
        white-space: pre-wrap;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.9em;
      }

      /* Resizer for split pane */
      .resizer {
        position: fixed;
        top: 0;
        right: 0;
        width: 5px;
        height: 100%;
        cursor: ew-resize;
        background: transparent;
        z-index: 9999;
        transition: background 0.2s ease;
      }

      .resizer:hover,
      .resizer.dragging {
        background: #3498db;
      }

      /* Bookmark section styles */
      .bookmarks-section {
        border-top: 1px solid #ddd;
        padding: 12px;
        background: #fafafa;
        max-height: 200px;
        overflow-y: auto;
        transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.3s ease;
      }

      .bookmarks-section.collapsed {
        max-height: 0;
        padding: 0 12px;
        opacity: 0;
        overflow: hidden;
      }

      .bookmarks-section h3 {
        font-size: 12px;
        margin-bottom: 8px;
        color: #666;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .bookmark-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .bookmark-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 8px;
        background: white;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 11px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .bookmark-item:hover {
        background: #e8f4f8;
      }

      .bookmark-info {
        flex: 1;
        min-width: 0;
        margin-right: 8px;
      }

      .bookmark-title {
        font-weight: 500;
        color: #2c3e50;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 2px;
      }

      .bookmark-url {
        font-size: 10px;
        color: #7f8c8d;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bookmark-actions {
        display: flex;
        gap: 4px;
      }

      .bookmark-actions button {
        padding: 2px 6px;
        font-size: 10px;
      }

      .bookmark-btn {
        background: #f39c12;
        color: white;
        border: none;
        border-radius: 4px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      }

      .bookmark-btn:hover {
        background: #e67e22;
      }

      .bookmark-btn.bookmarked {
        background: #e74c3c;
      }

      .bookmark-btn.bookmarked:hover {
        background: #c0392b;
      }

      .bookmark-search {
        margin-bottom: 8px;
      }

      .bookmark-search input {
        width: 100%;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 11px;
      }

      .bookmark-empty {
        text-align: center;
        color: #999;
        font-size: 11px;
        padding: 12px;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="resizer" id="resizer" title="Drag to resize chat panel"></div>
    <div class="header">
      <button id="menuButton" class="menu-button" title="Toggle menu sections">☰</button>
      <div class="header-content">
        <h1>🤖 LLM-DOM Browser</h1>
        <p>Analyze web content with AI</p>
      </div>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="message system">
        Welcome to LLM-DOM Browser. Open tabs and ask questions about their content!
      </div>
    </div>

    <div class="tabs-section">
      <h3>📑 Open Tabs</h3>
      <div class="help-text">Click tab to view, checkbox to select for LLM</div>
      <div class="tab-list" id="tabList"></div>
    </div>

    <div class="bookmarks-section">
      <h3>⭐ Bookmarks</h3>
      <div class="bookmark-search">
        <input type="text" id="bookmarkSearchInput" placeholder="Search bookmarks..." />
      </div>
      <div class="bookmark-list" id="bookmarkList"></div>
    </div>

    <div class="input-section">
      <div class="input-row">
        <input type="text" id="urlInput" placeholder="Enter URL or file path..." />
        <button id="openBtn" class="button-small">Open</button>
        <button id="bookmarkBtn" class="bookmark-btn button-small" title="Bookmark current tab">★</button>
      </div>

      <div class="input-row">
        <input type="file" id="fileInput" accept=".pdf,.txt,.md" />
        <button id="uploadBtn" class="button-small">Upload</button>
      </div>

      <div class="input-row">
        <input type="text" id="queryInput" placeholder="Ask a question..." />
        <button id="sendBtn" class="button-small">Send</button>
      </div>

      <div class="input-row">
        <label>
          <input type="checkbox" id="includeMediaCheckbox" />
          Include page screenshot for vision models (512px max, visible area)
        </label>
      </div>

      <div class="input-row">
        <input type="password" id="apiKeyInput" placeholder="API Key..." />
      </div>

      <div class="input-row">
        <label for="providerSelect">Provider:</label>
        <select id="providerSelect">
          <option value="openai">OpenAI (GPT-5.1)</option>
          <option value="anthropic">Anthropic (Claude 4.5)</option>
          <option value="google">Google (Gemini 2.5 Pro)</option>
          <option value="xai">xAI (Grok 4)</option>
          <option value="deepseek">DeepSeek (V3.2 Exp)</option>
          <option value="kimi">Kimi (K2 Thinking)</option>
          <option value="minimax">MiniMax (M2)</option>
          <option value="glm">GLM (4.6)</option>
          <option value="openrouter">OpenRouter</option>
          <option value="fireworks">Fireworks AI</option>
          <optgroup label="Local Providers">
            <option value="ollama">Ollama (Local)</option>
            <option value="vllm">vLLM (Local)</option>
            <option value="lmstudio">LM Studio (Local)</option>
          </optgroup>
        </select>
      </div>

      <div class="input-row" id="endpointRow" style="display: none;">
        <input type="text" id="endpointInput" placeholder="Endpoint URL (e.g., http://localhost:11434)" />
        <button id="checkHealthBtn" class="button-small" title="Check connection">Check</button>
        <span id="healthStatus"></span>
      </div>

      <div class="input-row">
        <label for="modelSelect">Model:</label>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
          <input type="text" id="modelSearchInput" placeholder="Search models..." style="display: none;" />
          <select id="modelSelect">
            <option value="">Default</option>
          </select>
        </div>
        <button id="refreshModelsBtn" class="button-small" style="display: none;" title="Refresh models from local provider">Refresh</button>
      </div>

      <div id="ollamaManagement" style="display: none; margin-top: 10px; padding: 10px; border: 1px solid #444; border-radius: 4px; background: #2a2a2a;">
        <div style="font-weight: bold; margin-bottom: 8px;">Ollama Model Management</div>
        <div class="input-row">
          <input type="text" id="ollamaPullInput" placeholder="Model name (e.g., llama3.2, mistral)" style="flex: 1;" />
          <button id="ollamaPullBtn" class="button-small">Pull Model</button>
        </div>
        <div id="ollamaPullProgress" style="margin-top: 8px; font-size: 12px; color: #aaa;"></div>
      </div>

      <div class="status" id="status"></div>
    </div>

    <script>
      // Storage constants
      const STORAGE_KEY = 'llm-dom-browser-settings';
      const BOOKMARKS_KEY = 'llm-dom-browser-bookmarks';

      // Local providers that don't require API keys
      const LOCAL_PROVIDERS = ['ollama', 'vllm', 'lmstudio'];
      const DEFAULT_ENDPOINTS = {
        'ollama': 'http://localhost:11434',
        'vllm': 'http://localhost:8000/v1',
        'lmstudio': 'http://localhost:1234/v1'
      };

      // Storage management
      const storage = {
        load() {
          try {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : {
              apiKeys: {},
              selectedModels: {},
              fetchedModels: {},
              endpoints: {}
            };
          } catch (error) {
            console.error('Error loading settings:', error);
            return { apiKeys: {}, selectedModels: {}, fetchedModels: {}, endpoints: {} };
          }
        },

        save(data) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            console.log('Settings saved to localStorage:', data);
          } catch (error) {
            console.error('Error saving settings:', error);
          }
        },

        getApiKey(provider) {
          const data = this.load();
          return data.apiKeys[provider] || '';
        },

        saveApiKey(provider, apiKey) {
          const data = this.load();
          data.apiKeys[provider] = apiKey;
          this.save(data);
          console.log(`Saved API key for provider: ${provider}`);
        },

        getSelectedModel(provider) {
          const data = this.load();
          return data.selectedModels[provider] || '';
        },

        saveSelectedModel(provider, model) {
          const data = this.load();
          data.selectedModels[provider] = model;
          this.save(data);
          console.log(`Saved selected model for ${provider}: ${model}`);
        },

        getFetchedModels(provider) {
          const data = this.load();
          return data.fetchedModels[provider] || null;
        },

        saveFetchedModels(provider, models) {
          const data = this.load();
          data.fetchedModels[provider] = models;
          this.save(data);
          console.log(`Saved fetched models for ${provider}:`, models);
        },

        getEndpoint(provider) {
          const data = this.load();
          return data.endpoints[provider] || DEFAULT_ENDPOINTS[provider] || '';
        },

        saveEndpoint(provider, endpoint) {
          const data = this.load();
          data.endpoints[provider] = endpoint;
          this.save(data);
          console.log(`Saved endpoint for ${provider}: ${endpoint}`);
        }
      };

      // Bookmark storage management
      const bookmarkStorage = {
        load() {
          try {
            const data = localStorage.getItem(BOOKMARKS_KEY);
            return data ? JSON.parse(data) : [];
          } catch (error) {
            console.error('Error loading bookmarks:', error);
            return [];
          }
        },

        save(bookmarks) {
          try {
            localStorage.setItem(BOOKMARKS_KEY, JSON.stringify(bookmarks));
            console.log('Bookmarks saved:', bookmarks);
          } catch (error) {
            console.error('Error saving bookmarks:', error);
          }
        },

        add(url, title, tags = []) {
          const bookmarks = this.load();

          // Check if bookmark already exists
          const existingIndex = bookmarks.findIndex(b => b.url === url);
          if (existingIndex !== -1) {
            // Update existing bookmark
            bookmarks[existingIndex].title = title;
            bookmarks[existingIndex].tags = tags;
            bookmarks[existingIndex].lastUpdated = new Date().toISOString();
            this.save(bookmarks);
            return bookmarks[existingIndex];
          }

          // Create new bookmark
          const bookmark = {
            id: `bookmark_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
            url,
            title: title || url,
            tags: tags || [],
            createdAt: new Date().toISOString(),
            lastUpdated: new Date().toISOString()
          };

          bookmarks.unshift(bookmark); // Add to beginning
          this.save(bookmarks);
          return bookmark;
        },

        remove(bookmarkId) {
          const bookmarks = this.load();
          const filtered = bookmarks.filter(b => b.id !== bookmarkId);
          this.save(filtered);
          return filtered.length < bookmarks.length;
        },

        update(bookmarkId, updates) {
          const bookmarks = this.load();
          const index = bookmarks.findIndex(b => b.id === bookmarkId);

          if (index === -1) return null;

          // Update allowed fields
          ['title', 'tags', 'url'].forEach(field => {

              bookmarks[index][field] = updates[field];
            }
          });

          bookmarks[index].lastUpdated = new Date().toISOString();
          this.save(bookmarks);
          return bookmarks[index];
        },

        isBookmarked(url) {
          const bookmarks = this.load();
          return bookmarks.find(b => b.url === url) || null;
        },

        search(query) {
          const bookmarks = this.load();
          const lowerQuery = query.toLowerCase();
          return bookmarks.filter(b =>
            b.title.toLowerCase().includes(lowerQuery) ||
            b.url.toLowerCase().includes(lowerQuery) ||
            (b.tags && b.tags.some(tag => tag.toLowerCase().includes(lowerQuery)))

      /**
       * Toggle search input visibility based on number of models
       */
      function toggleModelSearch() {
        const optionCount = modelSelect.querySelectorAll('option').length;
        // Show search if there are more than 10 options (excluding special options like Default and Fetch)
        if (optionCount > 10) {
          modelSearchInput.style.display = 'block';

          modelSearchInput.value = ''; // Clear search when hidden
        }
      }

      /**
       * Filter models based on search term
       */
      function filterModels(searchTerm) {
        const term = searchTerm.toLowerCase().trim();

        if (!term) {
          // No search term - restore all options and optgroups
          modelSelect.innerHTML = '';
          modelSearchState.allOptions.forEach(option => {
            modelSelect.appendChild(option);
          });
          modelSearchState.allOptgroups.forEach(optgroup => {
            modelSelect.appendChild(optgroup);
          });
          return;
        }

        // Clear the select
        modelSelect.innerHTML = '';

        // Filter and add matching options
        let hasMatches = false;

        // Handle options that are direct children (not in optgroups)
        modelSearchState.allOptions.forEach(option => {
          const text = option.textContent.toLowerCase();
          const value = option.value.toLowerCase();

          if (text.includes(term) || value.includes(term)) {
            // Check if this option belongs to an optgroup
            const belongsToOptgroup = modelSearchState.allOptgroups.some(og =>
              Array.from(og.querySelectorAll('option')).includes(option)
            );

            if (!belongsToOptgroup) {
              modelSelect.appendChild(option.cloneNode(true));
              hasMatches = true;
            }
          }
        });

        // Handle optgroups
        modelSearchState.allOptgroups.forEach(optgroup => {
          const clonedOptgroup = optgroup.cloneNode(false); // Clone without children
          let groupHasMatches = false;

          Array.from(optgroup.querySelectorAll('option')).forEach(option => {
            const text = option.textContent.toLowerCase();
            const value = option.value.toLowerCase();

            if (text.includes(term) || value.includes(term)) {
              clonedOptgroup.appendChild(option.cloneNode(true));
              groupHasMatches = true;
              hasMatches = true;
            }
          });

          if (groupHasMatches) {
            modelSelect.appendChild(clonedOptgroup);
          }
        });

        // If no matches, show a message
        if (!hasMatches) {
          const noMatchOption = document.createElement('option');
          noMatchOption.disabled = true;
          noMatchOption.textContent = 'No models match your search';
          modelSelect.appendChild(noMatchOption);
        }
      }

      /**
       * Render markdown text with code highlighting and math support
       * @param {string} text - The markdown text to render
       * @returns {string} - Sanitized HTML
       */
      function renderMarkdown(text) {
        // Configure marked for code highlighting
        marked.setOptions({
          highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
              try {
                return hljs.highlight(code, { language: lang }).value;
              } catch (err) {
                console.error('Highlighting error:', err);
              }
            }
            return hljs.highlightAuto(code).value;
          },
          breaks: true,
          gfm: true
        });

        // Process LaTeX math expressions before markdown
        // Replace display math $$...$$ with placeholders
        const displayMathPlaceholders = [];
        let processed = text.replace(/\$\$([\s\S]+?)\$\$/g, (match, math) => {
          const placeholder = `__DISPLAYMATH${displayMathPlaceholders.length}__`;
          try {
            const rendered = katex.renderToString(math.trim(), {
              displayMode: true,
              throwOnError: false,
              output: 'html'
            });
            displayMathPlaceholders.push(rendered);
          } catch (err) {
            console.error('KaTeX display math error:', err);
            displayMathPlaceholders.push(match); // Keep original if error
          }
          return placeholder;
        });

        // Replace inline math $...$ with placeholders
        const inlineMathPlaceholders = [];
        processed = processed.replace(/\$([^\$\n]+?)\$/g, (match, math) => {
          const placeholder = `__INLINEMATH${inlineMathPlaceholders.length}__`;
          try {
            const rendered = katex.renderToString(math.trim(), {
              displayMode: false,
              throwOnError: false,
              output: 'html'
            });
            inlineMathPlaceholders.push(rendered);
          } catch (err) {
            console.error('KaTeX inline math error:', err);
            inlineMathPlaceholders.push(match); // Keep original if error
          }
          return placeholder;
        });

        // Render markdown
        let html = marked.parse(processed);

        // Restore math placeholders
        displayMathPlaceholders.forEach((math, i) => {
          html = html.replace(`__DISPLAYMATH${i}__`, math);
        });
        inlineMathPlaceholders.forEach((math, i) => {
          html = html.replace(`__INLINEMATH${i}__`, math);
        });

        // Sanitize and return
        return DOMPurify.sanitize(html, {
          ADD_TAGS: ['math', 'semantics', 'mrow', 'mi', 'mo', 'mn', 'msup', 'msub', 'mfrac', 'mtext'],
          ADD_ATTR: ['class', 'style']
        });
      }

      /**
       * Copy text to clipboard
       * @param {string} text - Text to copy
       * @param {HTMLElement} button - The copy button element
       */
      function copyToClipboard(text, button) {
        navigator.clipboard.writeText(text).then(() => {
          const originalText = button.textContent;
          button.textContent = 'Copied!';
          button.classList.add('copied');
          setTimeout(() => {
            button.textContent = originalText;
            button.classList.remove('copied');
          }, 2000);
        }).catch(err => {
          console.error('Failed to copy:', err);
          button.textContent = 'Failed';
          setTimeout(() => {
            button.textContent = 'Copy';
          }, 2000);
        });
      }

      /**
       * Add message to chat
       * @param {string} text - The message text
       * @param {string} type - Message type: 'user', 'assistant', 'system', 'error'
       * @param {Object} stats - Optional stats to display (latency, tokens, etc.)
       */
      function addMessage(text, type = 'assistant', stats = null) {
        // Create message container
        const containerEl = document.createElement('div');
        containerEl.className = `message-container ${type}`;

        // Create message element
        const messageEl = document.createElement('div');
        messageEl.className = `message ${type}`;

        // For user and assistant messages, create dual view (raw/rendered)
        const isFormattable = (type === 'user' || type === 'assistant');

        if (isFormattable) {
          // Create rendered content div
          const renderedDiv = document.createElement('div');
          renderedDiv.className = 'message-content';
          renderedDiv.innerHTML = renderMarkdown(text);
          renderedDiv.style.display = 'block';

          // Create raw content div
          const rawDiv = document.createElement('div');
          rawDiv.className = 'message-raw';
          rawDiv.textContent = text;
          rawDiv.style.display = 'none';

          messageEl.appendChild(renderedDiv);
          messageEl.appendChild(rawDiv);

          // Create controls (copy button + toggle)
          const controlsDiv = document.createElement('div');
          controlsDiv.className = 'message-controls';

          // Copy button
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.textContent = 'Copy';
          copyBtn.addEventListener('click', () => copyToClipboard(text, copyBtn));

          // Toggle checkbox
          const toggleLabel = document.createElement('label');
          const toggleCheckbox = document.createElement('input');
          toggleCheckbox.type = 'checkbox';
          toggleCheckbox.checked = false;
          toggleCheckbox.addEventListener('change', (e) => {
            if (e.target.checked) {
              // Show raw
              renderedDiv.style.display = 'none';
              rawDiv.style.display = 'block';
            } else {
              // Show rendered
              renderedDiv.style.display = 'block';
              rawDiv.style.display = 'none';
            }
          });

          const toggleText = document.createTextNode('Show raw text');
          toggleLabel.appendChild(toggleCheckbox);
          toggleLabel.appendChild(toggleText);

          controlsDiv.appendChild(copyBtn);
          controlsDiv.appendChild(toggleLabel);

          messageEl.appendChild(controlsDiv);
        } else {
          // For system/error messages, just use plain text
          messageEl.textContent = text;
        }

        containerEl.appendChild(messageEl);

        // Add stats if provided (for assistant messages)
        if (stats && type === 'assistant') {
          const statsEl = document.createElement('div');
          statsEl.className = 'message-stats';

          const statItems = [];

          // Add latency
          if (stats.latencyMs !== undefined) {
            statItems.push(`<span class="stat-item"><span class="stat-label">Latency:</span> ${(stats.latencyMs / 1000).toFixed(2)}s</span>`);
          }

          // Add token breakdown
          if (stats.usage) {
            const usage = stats.usage;
            if (usage.input_tokens !== undefined && usage.output_tokens !== undefined) {
              // Anthropic format
              statItems.push(`<span class="stat-item"><span class="stat-label">Tokens:</span> ${usage.input_tokens} in / ${usage.output_tokens} out (${usage.input_tokens + usage.output_tokens} total)</span>`);
            } else if (usage.prompt_tokens !== undefined && usage.completion_tokens !== undefined) {
              // OpenAI format
              statItems.push(`<span class="stat-item"><span class="stat-label">Tokens:</span> ${usage.prompt_tokens} in / ${usage.completion_tokens} out (${usage.total_tokens || (usage.prompt_tokens + usage.completion_tokens)} total)</span>`);
            } else if (stats.tokensUsed) {
              // Fallback to rough estimate
              statItems.push(`<span class="stat-item"><span class="stat-label">Tokens:</span> ~${stats.tokensUsed}</span>`);
            }
          } else if (stats.tokensUsed) {
            statItems.push(`<span class="stat-item"><span class="stat-label">Tokens:</span> ~${stats.tokensUsed}</span>`);
          }

          // Add model info
          if (stats.model) {
            statItems.push(`<span class="stat-item"><span class="stat-label">Model:</span> ${stats.model}</span>`);
          }

          statsEl.innerHTML = statItems.join('');
          containerEl.appendChild(statsEl);
        }

        chatContainer.appendChild(containerEl);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      /**
       * Update status message
       */
      function updateStatus(text, type = 'info') {
        statusEl.textContent = text;
        statusEl.className = `status ${type}`;
      }

      /**
       * Open a tab with URL
       */
      async function handleOpenTab() {
        const url = urlInput.value.trim();
        if (!url) {
          updateStatus('Please enter a URL', 'error');
          return;
        }

        try {
          setLoading(true);
          updateStatus('Opening tab...');

          // Ensure URL has protocol
          let finalUrl = url;
          if (!url.startsWith('http') && !url.startsWith('file')) {
            finalUrl = 'https://' + url;
          }

          const result = await window.electronAPI.openTab(finalUrl);
          console.log('[UI] Tab opened, result:', result);

          // Use the title from the result if available, otherwise default to 'Loading...'
          const initialTitle = result.title || 'Loading...';
          state.activeTabs.set(result.id, { url: result.url, title: initialTitle });

          // Set as active tab if it's the first tab
          if (result.isActive) {
            state.activeTabId = result.id;
          }

          console.log('[UI] Active tabs after opening:', Array.from(state.activeTabs.entries()));
          addMessage(`✅ Opened: ${finalUrl}`, 'system');
          updateStatus('Tab opened successfully', 'success');
          urlInput.value = '';
          renderTabs();
          updateBookmarkButton();
        } catch (error) {
          updateStatus(`Error: ${error.message}`, 'error');
          addMessage(`❌ Error: ${error.message}`, 'system');
        } finally {
          setLoading(false);
        }
      }

      /**
       * Upload a file
       */
      async function handleUploadFile() {
        const file = fileInput.files[0];
        if (!file) {
          updateStatus('Please select a file', 'error');
          return;
        }

        try {
          setLoading(true);
          updateStatus('Uploading file...');

          // In a real app, you'd use a file dialog here
          // For now, we'll mock it
          const result = await window.electronAPI.uploadFile(file.name, file.name);
          state.activeTabs.set(result.tabId, { url: file.name, title: result.fileName });

          addMessage(`📄 Uploaded: ${file.name}`, 'system');
          updateStatus('File uploaded successfully', 'success');
          fileInput.value = '';
          renderTabs();
        } catch (error) {
          updateStatus(`Error: ${error.message}`, 'error');
          addMessage(`❌ Error: ${error.message}`, 'system');
        } finally {
          setLoading(false);
        }
      }

      /**
       * Send query to LLM
       */
      async function handleSendQuery() {
        const query = queryInput.value.trim();
        const apiKey = apiKeyInput.value.trim();
        const provider = providerSelect.value;
        const model = modelSelect.value || null;
        const tabIds = Array.from(state.selectedTabs);
        const includeMedia = includeMediaCheckbox.checked;
        const isLocal = LOCAL_PROVIDERS.includes(provider);
        const customEndpoint = isLocal ? endpointInput.value.trim() : null;

        if (!query) {
          updateStatus('Please enter a question', 'error');
          return;
        }

        // API key is optional for local providers
        if (!isLocal && !apiKey) {
          updateStatus('Please enter API key', 'error');
          return;
        }

        if (tabIds.length === 0) {
          updateStatus('Please select at least one tab', 'error');
          return;
        }

        // Save API key and endpoint if applicable
        if (apiKey) {
          storage.saveApiKey(provider, apiKey);
        }
        if (isLocal && customEndpoint) {
          storage.saveEndpoint(provider, customEndpoint);
        }

        try {
          setLoading(true);
          updateStatus(`Analyzing content with ${provider}...`);
          addMessage(`Q: ${query}`, 'user');

          const result = await window.electronAPI.queryLLM(query, tabIds, apiKey, provider, model, includeMedia, customEndpoint);

          if (result.success) {
            // Display response with stats
            addMessage(result.response, 'assistant', {
              latencyMs: result.latencyMs,
              usage: result.usage,
              tokensUsed: result.tokensUsed,
              model: result.model
            });
            updateStatus(
              `Response generated using ${result.provider}`,
              'success'
            );
          } else {
            updateStatus(`Error: ${result.error}`, 'error');
            addMessage(`❌ ${result.error}`, 'error');
          }

          queryInput.value = '';
        } catch (error) {
          updateStatus(`Error: ${error.message}`, 'error');
          addMessage(`❌ ${error.message}`, 'error');
        } finally {
          setLoading(false);
        }
      }

      /**
       * Close a tab
       */
      async function closeTab(tabId) {
        try {
          await window.electronAPI.closeTab(tabId);
          state.activeTabs.delete(tabId);
          state.selectedTabs.delete(tabId);
          addMessage(`Closed tab`, 'system');
          renderTabs();
        } catch (error) {
          updateStatus(`Error closing tab: ${error.message}`, 'error');
        }
      }

      /**
       * Switch to a tab (make it visible)
       */
      async function switchTab(tabId) {
        try {
          await window.electronAPI.switchTab(tabId);
          // The active tab will be updated via the onActiveTabChanged listener
          updateBookmarkButton();
        } catch (error) {
          console.error('Error switching tab:', error);
          updateStatus(`Error switching tab: ${error.message}`, 'error');
        }
      }

      /**
       * Toggle tab selection for LLM query
       */
      function toggleTabSelection(tabId) {
        if (state.selectedTabs.has(tabId)) {
          state.selectedTabs.delete(tabId);
        } else {
          state.selectedTabs.add(tabId);
        }
        renderTabs();
      }

      /**
       * Render tabs list
       */
      function renderTabs() {
        tabList.innerHTML = '';
        state.activeTabs.forEach((tab, tabId) => {
          const isSelected = state.selectedTabs.has(tabId);
          const isCurrent = state.activeTabId === tabId;
          const tabEl = document.createElement('div');

          // Add classes for visual states
          const classes = ['tab-item'];
          if (isSelected) classes.push('active');
          if (isCurrent) classes.push('current');
          tabEl.className = classes.join(' ');

          // Create tab content with checkbox and title
          const title = tab.title || 'Untitled';
          const currentIndicator = isCurrent ? '👁 ' : '';

          // Create checkbox
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = isSelected;
          checkbox.style.cursor = 'pointer';
          checkbox.title = isSelected ? 'Remove from LLM query' : 'Include in LLM query';
          checkbox.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent triggering tab switch
            toggleTabSelection(tabId);
          });

          // Create title span
          const titleSpan = document.createElement('span');
          titleSpan.textContent = `${currentIndicator}${title}`;

          // Create clickable div for tab switching
          const clickableDiv = document.createElement('div');
          clickableDiv.className = 'clickable-area';
          clickableDiv.style.cssText = 'flex: 1; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 2px;';
          clickableDiv.title = isCurrent ? 'Currently viewing (click to refresh)' : 'Click to switch to this tab';
          clickableDiv.appendChild(checkbox);
          clickableDiv.appendChild(titleSpan);
          clickableDiv.addEventListener('click', (e) => {
            // Only switch tabs if not clicking the checkbox
            if (e.target !== checkbox) {
              switchTab(tabId);
            }
          });

          // Create close button
          const closeBtn = document.createElement('button');
          closeBtn.textContent = 'Close';
          closeBtn.className = 'button-small';
          closeBtn.addEventListener('click', () => closeTab(tabId));

          tabEl.appendChild(clickableDiv);
          tabEl.appendChild(closeBtn);
          tabList.appendChild(tabEl);
        });
      }

      /**
       * Set loading state
       */
      function setLoading(loading) {
        state.isLoading = loading;
        openBtn.disabled = loading;
        uploadBtn.disabled = loading;
        sendBtn.disabled = loading;
        urlInput.disabled = loading;
        queryInput.disabled = loading;
      }

      /**
       * Bookmark Functions
       */

      /**
       * Add or remove bookmark for current tab
       */
      function toggleBookmark() {
        if (!state.activeTabId) {
          updateStatus('No active tab to bookmark', 'error');
          return;
        }

        const activeTab = state.activeTabs.get(state.activeTabId);
        if (!activeTab) {
          updateStatus('Could not find active tab', 'error');
          return;
        }

        const existingBookmark = bookmarkStorage.isBookmarked(activeTab.url);

        if (existingBookmark) {
          // Remove bookmark
          bookmarkStorage.remove(existingBookmark.id);
          updateStatus('Bookmark removed', 'success');
          addMessage(`🗑️ Removed bookmark: ${activeTab.title}`, 'system');
        } else {
          // Add bookmark
          const bookmark = bookmarkStorage.add(activeTab.url, activeTab.title);
          updateStatus('Bookmark added', 'success');
          addMessage(`⭐ Bookmarked: ${activeTab.title}`, 'system');
        }

        renderBookmarks();
        updateBookmarkButton();
      }

      /**
       * Update bookmark button state based on current tab
       */
      function updateBookmarkButton() {
        if (!state.activeTabId) {
          bookmarkBtn.classList.remove('bookmarked');
          bookmarkBtn.title = 'No active tab';
          return;
        }

        const activeTab = state.activeTabs.get(state.activeTabId);
        if (!activeTab) {
          bookmarkBtn.classList.remove('bookmarked');
          bookmarkBtn.title = 'Bookmark current tab';
          return;
        }

        const isBookmarked = bookmarkStorage.isBookmarked(activeTab.url);
        if (isBookmarked) {
          bookmarkBtn.classList.add('bookmarked');
          bookmarkBtn.title = 'Remove bookmark';
        } else {
          bookmarkBtn.classList.remove('bookmarked');
          bookmarkBtn.title = 'Bookmark current tab';
        }
      }

      /**
       * Open a bookmarked URL
       */
      async function openBookmark(url) {
        try {
          setLoading(true);
          updateStatus('Opening bookmark...');

          const result = await window.electronAPI.openTab(url);
          const initialTitle = result.title || 'Loading...';
          state.activeTabs.set(result.id, { url: result.url, title: initialTitle });

          if (result.isActive) {
            state.activeTabId = result.id;
          }

          addMessage(`✅ Opened bookmark: ${url}`, 'system');
          updateStatus('Bookmark opened successfully', 'success');
          renderTabs();
          updateBookmarkButton();
        } catch (error) {
          updateStatus(`Error: ${error.message}`, 'error');
          addMessage(`❌ Error: ${error.message}`, 'system');
        } finally {
          setLoading(false);
        }
      }

      /**
       * Remove a bookmark
       */
      function removeBookmark(bookmarkId, event) {
        if (event) {
          event.stopPropagation(); // Prevent opening bookmark when deleting
        }

        const bookmarks = bookmarkStorage.load();
        const bookmark = bookmarks.find(b => b.id === bookmarkId);

        if (bookmark) {
          bookmarkStorage.remove(bookmarkId);
          addMessage(`🗑️ Removed bookmark: ${bookmark.title}`, 'system');
          updateStatus('Bookmark removed', 'success');
          renderBookmarks();
          updateBookmarkButton();
        }
      }

      /**
       * Render bookmarks list
       */
      function renderBookmarks(searchQuery = '') {
        const bookmarks = searchQuery
          ? bookmarkStorage.search(searchQuery)
          : bookmarkStorage.load();

        bookmarkList.innerHTML = '';

        if (bookmarks.length === 0) {
          const emptyEl = document.createElement('div');
          emptyEl.className = 'bookmark-empty';
          emptyEl.textContent = searchQuery
            ? 'No bookmarks found'
            : 'No bookmarks yet. Click the ★ button to bookmark the current tab.';
          bookmarkList.appendChild(emptyEl);
          return;
        }

        bookmarks.forEach(bookmark => {
          const bookmarkEl = document.createElement('div');
          bookmarkEl.className = 'bookmark-item';

          // Create info section
          const infoEl = document.createElement('div');
          infoEl.className = 'bookmark-info';

          const titleEl = document.createElement('div');
          titleEl.className = 'bookmark-title';
          titleEl.textContent = bookmark.title;

          const urlEl = document.createElement('div');
          urlEl.className = 'bookmark-url';
          urlEl.textContent = bookmark.url;

          infoEl.appendChild(titleEl);
          infoEl.appendChild(urlEl);

          // Create actions section
          const actionsEl = document.createElement('div');
          actionsEl.className = 'bookmark-actions';

          const deleteBtn = document.createElement('button');
          deleteBtn.textContent = 'Delete';
          deleteBtn.className = 'button-small';
          deleteBtn.style.background = '#e74c3c';
          deleteBtn.addEventListener('click', (e) => removeBookmark(bookmark.id, e));

          actionsEl.appendChild(deleteBtn);

          // Click on bookmark item to open
          bookmarkEl.addEventListener('click', (e) => {
            if (e.target === bookmarkEl || e.target === infoEl || e.target === titleEl || e.target === urlEl) {
              openBookmark(bookmark.url);
            }
          });

          bookmarkEl.appendChild(infoEl);
          bookmarkEl.appendChild(actionsEl);
          bookmarkList.appendChild(bookmarkEl);
        });
      }

      /**
       * Handle bookmark search
       */
      function handleBookmarkSearch() {
        const query = bookmarkSearchInput.value.trim();
        renderBookmarks(query);
      }

      // Event Listeners
      menuButton.addEventListener('click', () => menuState.toggle());
      openBtn.addEventListener('click', handleOpenTab);
      uploadBtn.addEventListener('click', handleUploadFile);
      sendBtn.addEventListener('click', handleSendQuery);
      checkHealthBtn.addEventListener('click', checkProviderHealth);
      refreshModelsBtn.addEventListener('click', refreshLocalModels);
      ollamaPullBtn.addEventListener('click', pullOllamaModel);
      bookmarkBtn.addEventListener('click', toggleBookmark);
      bookmarkSearchInput.addEventListener('input', handleBookmarkSearch);

      // Save endpoint on change
      endpointInput.addEventListener('change', () => {
        const provider = providerSelect.value;
        if (LOCAL_PROVIDERS.includes(provider)) {
          storage.saveEndpoint(provider, endpointInput.value.trim());
        }
      });

      urlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleOpenTab();
      });
      queryInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSendQuery();
      });
      ollamaPullInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') pullOllamaModel();
      });

      // Listen for tab title updates from main process
      if (window.electronAPI && window.electronAPI.onTabTitleUpdated) {
        console.log('[UI] Setting up onTabTitleUpdated listener');
        window.electronAPI.onTabTitleUpdated((data) => {
          console.log('[UI] Received tab-title-updated event:', data);
          const { tabId, title } = data;
          const tab = state.activeTabs.get(tabId);
          if (tab) {
            console.log(`[UI] Updating tab ${tabId} title from "${tab.title}" to "${title}"`);
            tab.title = title;
            state.activeTabs.set(tabId, tab);
            renderTabs();
          } else {
            console.warn(`[UI] Received title update for unknown tab ${tabId}`);
          }
        });
      } else {
        console.error('[UI] electronAPI.onTabTitleUpdated not available!');
      }

      // Listen for active tab changes from main process
      if (window.electronAPI && window.electronAPI.onActiveTabChanged) {
        console.log('[UI] Setting up onActiveTabChanged listener');
        window.electronAPI.onActiveTabChanged((data) => {
          console.log('[UI] Received active-tab-changed event:', data);
          const { tabId } = data;
          state.activeTabId = tabId;
          renderTabs();
          updateBookmarkButton();
        });
      } else {
        console.error('[UI] electronAPI.onActiveTabChanged not available!');
      }

      // Initialize tabs on UI load - get all existing tabs from main process
      if (window.electronAPI && window.electronAPI.getAllTabs) {
        console.log('[UI] Initializing tabs on UI load');
        window.electronAPI.getAllTabs().then((tabs) => {
          console.log('[UI] Retrieved existing tabs:', tabs);
          tabs.forEach(tab => {
            state.activeTabs.set(tab.id, { url: tab.url, title: tab.title });
            if (tab.isActive) {
              state.activeTabId = tab.id;
            }
          });
          renderTabs();
          updateBookmarkButton();
          console.log('[UI] Tabs initialized:', Array.from(state.activeTabs.entries()));
        }).catch(error => {
          console.error('[UI] Failed to initialize tabs:', error);
        });
      } else {
        console.error('[UI] electronAPI.getAllTabs not available!');
      }

      // Save all settings before window closes
      window.addEventListener('beforeunload', () => {
        // Save current API key
        const provider = providerSelect.value;
        const apiKey = apiKeyInput.value.trim();
        if (apiKey) {
          storage.saveApiKey(provider, apiKey);
          console.log(`Saved API key on beforeunload for provider: ${provider}`);
        }
      });

      // Resizer functionality for split pane
      const resizer = document.getElementById('resizer');
      let isResizing = false;
      let startX = 0;
      let startWidth = 400; // Default chat width

      resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = document.body.clientWidth; // Current chat panel width = window width (we're in the chat view)
        resizer.classList.add('dragging');

        // Prevent text selection during drag
        e.preventDefault();
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'ew-resize';
      });

      document.addEventListener('mousemove', async (e) => {
        if (!isResizing) return;

        // Calculate new width based on mouse position
        const newWidth = e.clientX;

        // Update immediately for smooth visual feedback
        if (window.electronAPI && window.electronAPI.updateChatWidth) {
          try {
            await window.electronAPI.updateChatWidth(newWidth);
          } catch (error) {
            console.error('Error updating chat width:', error);
          }
        }
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          resizer.classList.remove('dragging');
          document.body.style.userSelect = '';
          document.body.style.cursor = '';
        }
      });

      // Initialize
      async function initialize() {
        // Initialize menu state
        menuState.init();

        // Load providers
        await loadProviders();

        // Restore stored API key for current provider
        const provider = providerSelect.value;
        state.currentProvider = provider; // Track initial provider

        const savedApiKey = storage.getApiKey(provider);
        if (savedApiKey) {
          apiKeyInput.value = savedApiKey;
          console.log(`Restored API key on init for provider: ${provider}`);
        }

        // The model will be restored automatically when updateModelSelect is called above

        // Initialize bookmarks
        renderBookmarks();
        updateBookmarkButton();

        updateStatus('Ready', 'success');
        addMessage('👋 Welcome! Open a URL or upload a file to get started.', 'system');
        addMessage('💡 Tip: Press F12 to open DevTools for the UI, Ctrl+Shift+C for the active tab', 'system');
      }

      initialize();
    </script>
  </body>
</html>
